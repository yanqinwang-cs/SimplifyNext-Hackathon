[project]
name = "investigator"
version = "0.1.0"
description = "A deterministic case-state kernel for investigative assistants"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.7,<3"]

[dependency-groups]
dev = ["pytest>=8.0,<9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/investigator"]

[tool.pytest.ini_options]
testpaths = ["tests"]

